services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventora-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
